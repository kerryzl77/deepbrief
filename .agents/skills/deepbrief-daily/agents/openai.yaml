interface:
  display_name: "DeepBrief Daily"
  short_description: "Generate high-recall Codex-native AI/agents PDFs"
  default_prompt: "Use $deepbrief-daily for a long-running high-recall applied AI/agents brief. Explicitly spawn parallel subagents in waves for papers/evals, repos/releases, company engineering posts, model-training/inference notes, applied document AI, builder discourse, and verification. Screen at least 100 candidates across the required source lanes without padding one feed, download at least 20 raw artifacts into the local artifact directory, save raw fanout outputs under reviews/fanout/ or reviews/subagents/, then spawn source-specific deep-read/verification subagents over the selected artifacts before writing substantive per-selected-source read reports and an evidence matrix. Scripted read-workers are auxiliary and do not replace requested subagents. Write the brief with paragraph-level evidence, a source-aware mechanism trace, an evidence map, readable diagrams, and real code/config snippets only when backed by inspected artifacts. Render a ready-to-read PDF only after the research and PDF-quality gates pass."
