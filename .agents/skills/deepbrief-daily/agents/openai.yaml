interface:
  display_name: "DeepBrief Daily"
  short_description: "Generate high-recall Codex-native AI/agents PDFs"
  default_prompt: "Use $deepbrief-daily for a long-running high-recall applied AI/agents brief. Explicitly spawn parallel subagents in waves for papers/evals, repos/releases, company engineering posts, model-training/inference notes, applied document AI, builder discourse, and verification. Screen at least 100 candidates across the required source lanes without padding one feed, download at least 20 raw artifacts into the local artifact directory, save raw fanout outputs under reviews/fanout/ or reviews/subagents/, then spawn source-specific deep-read/verification subagents over the selected artifacts before writing substantive per-selected-source read reports and an evidence matrix. Scripted read-workers are auxiliary and do not replace requested subagents. Keep exact local evidence refs in read reports and the evidence matrix, but write the final PDF with paragraph-level public citation links like [1](#source-1) and a Citation Appendix containing titles plus raw source URLs. Author all final prose and diagrams from the read reports and lane syntheses — never from script templates — drafting each deep dive to drafts/ on large runs. Render a ready-to-read PDF only after the research and PDF-quality gates pass."
